name: Jira Sprint Report

on:
  schedule:
    - cron: "*/5 * * * *" # every 2 minutes (testing) — revert before deploying

  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Jira Sprint Report
        run: |
          curl --fail \
            --request GET \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.REPORT_URL }}"