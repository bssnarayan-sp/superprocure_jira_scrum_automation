name: Jira Sprint Report

on:
  schedule:
    - cron: "30 2,14 * * *" # 8:00 AM and 8:00 PM IST

  workflow_dispatch:

env:
  # Update this whenever the sprint changes — no other file needs to change.
  SPRINT: "Sprint 208"

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Jira Sprint Report
        run: |
          curl --fail \
            --request GET \
            --get \
            --data-urlencode "sprint=${SPRINT}" \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.REPORT_URL }}"
